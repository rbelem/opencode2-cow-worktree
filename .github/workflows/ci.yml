name: CI

# Every push to main and every pull request. No other triggers: the package is
# `private: true`, so there is deliberately no publish/release step.
on:
  push:
    branches: [main]
  pull_request:

# The workflow only reads the repository and runs checks.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Linux — gating checks.
  #
  # The full suite runs everywhere. The filesystem-dependent tests discover
  # their roots at runtime (`test/fs-roots.ts`): each probes for a CoW-capable
  # directory and a definitively non-CoW directory and skips cleanly when one
  # is absent. A GitHub-hosted runner has no CoW filesystem, so the positive
  # CoW tests skip there (visibly, in the test output) and the non-CoW tests
  # run against tmpfs. On a CoW-capable machine — this project's btrfs host —
  # the positive path runs for real. There is no per-file exclusion list and no
  # `continue-on-error`; a skip is honest, a failure is a failure.
  #
  # A green run on a runner is therefore not proof of the CoW clone itself;
  # that proof needs a CoW filesystem. It is proof that the CoW code did not
  # regress where it can be exercised, and that the non-CoW branches hold.
  # ---------------------------------------------------------------------------
  linux:
    name: Linux — typecheck + full unit suite
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.x

      # No lockfile is committed yet (see docs/ci.md). Resolve fresh until one
      # exists; once it does, --frozen-lockfile keeps CI on the developer's
      # exact dependency graph.
      - name: Install dependencies
        run: |
          if [ -f bun.lock ] || [ -f bun.lockb ]; then
            bun install --frozen-lockfile
          else
            bun install
          fi

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun test

  # ---------------------------------------------------------------------------
  # macOS — EARLY WARNING ONLY. THIS IS NOT THE ACCEPTANCE CRITERION FOR #7.
  #
  # Issue #7 requires a human on real APFS hardware pasting verification output
  # (an independent clone with genuinely shared extents). A green run here does
  # not close #7 and must never be read as doing so.
  #
  # The Darwin backend is NOT exercised by this job. Its *logic* is tested with
  # an injected fake syscall (`test/platform-darwin.test.ts`); the real
  # `copyfile(3)` path — APFS semantics, xattrs, resource forks, hard links —
  # runs only on real hardware. A different code path or a runner that gets
  # those semantics wrong would still show green here.
  #
  # The full suite runs, the same root-discovery logic applies, and the same
  # tests skip on a runner. macOS has no `/dev/shm`; `findNonCowRoot()` probes
  # `tmpdir()`/`homedir()`/`cwd()` as well, so it may still find one.
  # ---------------------------------------------------------------------------
  macos:
    name: macOS — early warning only, NOT #7 acceptance
    runs-on: macos-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.x

      - name: Install dependencies
        run: |
          if [ -f bun.lock ] || [ -f bun.lockb ]; then
            bun install --frozen-lockfile
          else
            bun install
          fi

      # Same checks as Linux. This does not run the Darwin clone and cannot
      # close #7.
      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests (Darwin backend not exercised)
        run: bun test
