name: CI

# Every push to main and every pull request. No other triggers: the package is
# `private: true`, so there is deliberately no publish/release step.
on:
  push:
    branches: [main]
  pull_request:

# The workflow only reads the repository and runs checks.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Linux — gating checks.
  #
  # The full suite runs everywhere. The filesystem-dependent tests discover
  # their roots at runtime (`test/fs-roots.ts`): each probes for a CoW-capable
  # directory and a definitively non-CoW directory and skips cleanly when one
  # is absent. A GitHub-hosted runner has no CoW filesystem, so the positive
  # CoW tests skip there (visibly, in the test output) and the non-CoW tests
  # run against tmpfs. On a CoW-capable machine — this project's btrfs host —
  # the positive path runs for real. There is no per-file exclusion list and no
  # `continue-on-error`; a skip is honest, a failure is a failure.
  #
  # A green run on a runner is therefore not proof of the CoW clone itself;
  # that proof needs a CoW filesystem. It is proof that the CoW code did not
  # regress where it can be exercised, and that the non-CoW branches hold.
  # ---------------------------------------------------------------------------
  linux:
    name: Linux — typecheck + full unit suite
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.x

      # No lockfile is committed yet (see docs/ci.md). Resolve fresh until one
      # exists; once it does, --frozen-lockfile keeps CI on the developer's
      # exact dependency graph.
      - name: Install dependencies
        run: |
          if [ -f bun.lock ] || [ -f bun.lockb ]; then
            bun install --frozen-lockfile
          else
            bun install
          fi

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun test

  # ---------------------------------------------------------------------------
  # macOS — EARLY WARNING ONLY. THIS IS NOT THE ACCEPTANCE CRITERION FOR #7.
  #
  # Issue #7 requires a human on real APFS hardware pasting verification output
  # (an independent clone with genuinely shared extents). A green run here does
  # not close #7 and must never be read as doing so.
  #
  # The Darwin backend is NOT exercised by this job. Its *logic* is tested with
  # an injected fake syscall (`test/platform-darwin.test.ts`); the real
  # `copyfile(3)` path — APFS semantics, xattrs, resource forks, hard links —
  # runs only on real hardware. A different code path or a runner that gets
  # those semantics wrong would still show green here. The job that actually
  # runs the Darwin backend and measures shared extents is `apfs-verification`
  # below; that one produces the #7 evidence.
  #
  # The full suite runs, the same root-discovery logic applies, and the same
  # tests skip on a runner. macOS has no `/dev/shm`; `findNonCowRoot()` probes
  # `tmpdir()`/`homedir()`/`cwd()` as well, so it may still find one.
  # ---------------------------------------------------------------------------
  macos:
    name: macOS — early warning only, NOT #7 acceptance
    runs-on: macos-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.x

      - name: Install dependencies
        run: |
          if [ -f bun.lock ] || [ -f bun.lockb ]; then
            bun install --frozen-lockfile
          else
            bun install
          fi

      # Same checks as Linux. This does not run the Darwin clone and cannot
      # close #7.
      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests (Darwin backend not exercised)
        run: bun test

  # ---------------------------------------------------------------------------
  # macOS APFS clone verification — THE EVIDENCE JOB FOR #7.
  #
  # Unlike `macos` above, this job runs the plugin's real Darwin backend
  # (`copyfile(3)` with `COPYFILE_CLONE_FORCE` through `bun:ffi`, via
  # `reflinkFile`) on a real APFS volume, then proves the clone genuinely
  # shares physical extents with its source. It is gated on measured evidence,
  # not on exit code: a clean clone alone is not enough.
  #
  # `scripts/verify-apfs/verify-apfs.ts`:
  #   1. resolves the scratch directory's mount point with `df -Pk`, then
  #      asserts the volume is APFS with `diskutil info <mount point>` (macOS
  #      has no `df -T`, and `diskutil info <subdir>` is invalid — it answers
  #      "Could not find disk", which the first real run proved);
  #   2. clones through the real backend;
  #   3. measures shared extents with `fcntl(fd, F_LOG2PHYS_EXT)` physical block
  #      mapping (Jaccard overlap ≈ 1.0), with a `df` free-space delta fallback.
  #      `du`/`st_blocks` cannot be used: APFS double-counts clones;
  #   4. mutates one byte, confirming the source is untouched and the block
  #      moved — a hardlink would change the source;
  #   5. fails loudly on ENOTSUP/EXDEV, on a non-APFS volume, and on an overlap
  #      that shows a byte copy. `--require` turns any clean local skip into a
  #      hard failure, so a skip can never masquerade as a pass.
  #
  # The report is written on every exit path, including a skip and an unexpected
  # exception, and uploaded from `runner.temp` with `if-no-files-found: warn`.
  #
  # No official GitHub document states the runner volume is APFS, so the job
  # asserts it at runtime before trusting anything else.
  #
  # This job is deliberately NOT `continue-on-error`. A green run does not close
  # #7 by itself: a human still approves the uploaded artifact. See docs/ci.md.
  #
  # `macos-latest` is the primary target (macOS 26 arm64). `macos-15-intel` is a
  # one-off cross-check on a distinct image and x86_64, kept cheap by running
  # the same short script once. Drop that matrix entry when `macos-15` retires.
  # ---------------------------------------------------------------------------
  apfs-verification:
    name: macOS APFS clone verification — #7 evidence (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-latest, macos-15-intel]
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.x

      - name: Install dependencies
        run: |
          if [ -f bun.lock ] || [ -f bun.lockb ]; then
            bun install --frozen-lockfile
          else
            bun install
          fi

      - name: Verify a real APFS clone with shared extents
        run: >-
          bun run scripts/verify-apfs/verify-apfs.ts
          --require
          --report=${{ runner.temp }}/apfs-verification-${{ matrix.runner }}.txt

      # The first real run lost its report to an uncaught throw, so make the
      # resolved paths explicit in the log. Harmless on success; diagnosis fuel
      # when the report is missing.
      - name: Locate the verification report
        if: always()
        run: |
          echo "runner.temp=${{ runner.temp }}"
          ls -la "${{ runner.temp }}/apfs-verification-${{ matrix.runner }}.txt" || echo "report not found in runner.temp"
          ls -la "apfs-verification-${{ matrix.runner }}.txt" 2>/dev/null || echo "report not found in workspace root"

      # `always()` so the evidence survives a failing verification — the human
      # approving #7 needs the measurement even when the verdict is FAIL.
      # `if-no-files-found: warn`, not `error`: a missing report must not fail
      # the upload step and obscure the verification step's own failure. The
      # script writes on every exit path, so a missing file means the script
      # died before it could write — which the verification step already fails
      # on, loudly, and the step above shows where to look.
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apfs-verification-${{ matrix.runner }}
          path: ${{ runner.temp }}/apfs-verification-${{ matrix.runner }}.txt
          if-no-files-found: warn
